name: Copilot Free native Auto probe
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    if: github.ref == 'refs/heads/test/copilot-native-auto'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm install --global @github/copilot@1.0.103
      - name: Check native Auto inference
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::error::Set the COPILOT_GITHUB_TOKEN repository secret."
            exit 1
          fi
          reply=$(copilot --model auto --disable-builtin-mcps --silent --prompt 'Reply with exactly COPILOT_AUTO_OK. Do not use tools.')
          printf '%s\n' "$reply"
          grep -Fxq 'COPILOT_AUTO_OK' <<< "$reply"
