name: Weekly documentation sync

on:
  schedule:
    # Monday at 09:17 KST (00:17 UTC).
    - cron: '17 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-doc-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Update the development reference
        run: node scripts/sync-docs.cjs

      - name: Open or update the documentation PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          base: main
          branch: automation/weekly-doc-sync
          add-paths: README.md
          delete-branch: true
          commit-message: 'docs: sync development reference from main'
          title: 'docs: 개발 문서를 main과 동기화'
          body: |
            `main`의 개발 환경, npm 스크립트, 소스 경로를 바탕으로 README를 갱신했습니다.
            변경 내용을 확인한 뒤 머지해 주세요.
